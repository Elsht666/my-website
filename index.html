<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>资源下载</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <style>
        :root {
            --bg: #2a2a32;
            --fg: #e6e6e6;
            --muted: #a3adba;
            --card: #22c55e;
            --card-hover: #7ab4e8;
            --accent: #4f8cff;
            --shadow: 0 10px 30px rgba(0, 0, 0, .25);
            --radius: 18px;
            --card-scale: 1;
            --pan-card-min-width: 340px;
            --pan-icon-size: 56px;
            --card-gap: 16px;
            --grid-padding: 0 18px 80px 152px;
            /* 导航栏背景：与日夜按钮夜间背景一致 */
            --header-bg: linear-gradient(135deg, #070d1c, #111a30, #1c2a48);
        }

        [data-theme="light"] {
            --bg: #F1F1ED;
            --fg: #1a1d24;
            --muted: #4d5561;
            --card: #22c55e;
            --card-hover: #4a8bc5;
            --accent: #84CC16;
            --shadow: 0 12px 28px rgba(0, 0, 0, .08);
            /* 导航栏背景：与日夜按钮白天背景一致（渐变蓝） */
            --header-bg: linear-gradient(135deg, #4a90d9, #6fb0ee, #9bcbf5);
        }

        html, body { height: 100%; }

        body {
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans",
                "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--fg);
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 14px;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
            transition: background .2s, color .2s;
        }

        header {
            position: relative;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 22px;
            flex-wrap: wrap;
            background: var(--header-bg);
            border-bottom: 1px solid rgba(127, 127, 127, .12);
            transition: background .5s;
            -webkit-user-select: none;
            user-select: none;
        }

        header h1 { font-size: 20px; margin: 0; letter-spacing: .2px; }

        .spacer { flex: 1; }

        .toolbar {
            display: inline-flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            appearance: none;
            border: 0;
            border-radius: 12px;
            padding: 10px 14px;
            cursor: pointer;
            background: var(--card);
            color: #fff;
            box-shadow: var(--shadow);
            font-weight: 500;
            transition: background .2s, filter .2s, transform .1s;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
            font-size: 14px;
        }

        .btn:hover { filter: brightness(1.08); }
        .btn:active { transform: scale(0.95); }

        .size-controls {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(127, 127, 127, .15);
            border-radius: 12px;
            padding: 4px;
        }

        .size-btn {
            appearance: none;
            border: 0;
            border-radius: 8px;
            width: 32px;
            height: 32px;
            cursor: pointer;
            background: transparent;
            color: var(--fg);
            font-size: 16px;
            font-weight: 600;
            display: grid;
            place-items: center;
            transition: background .15s, transform .1s;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        .size-btn:hover { background: rgba(127, 127, 127, .2); }
        .size-btn:active { transform: scale(0.9); }
        .size-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* ==================== 日夜切换按钮（复刻自快捷导航参考） ==================== */
        /* 按钮轨道：--ts 为整体缩放比例，调大调小只改这一处 */
        .toggle {
            --ts: 0.4;
            position: relative;
            box-sizing: border-box;
            width: calc(200px * var(--ts));
            height: calc(90px * var(--ts));
            border-radius: calc(90px * var(--ts));
            cursor: pointer;
            background: linear-gradient(135deg, #4a90d9, #6fb0ee, #9bcbf5);
            transition: background 0.7s, transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                box-shadow 0.5s ease, border-color 0.5s ease;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow:
                0 0 40px rgba(59, 130, 246, 0.15),
                0 8px 32px rgba(0, 0, 0, 0.06);
            flex-shrink: 0;
        }

        /* 夜间模式边界：更低调的边框 + 深邃星光晕 */
        .toggle.night {
            background: linear-gradient(135deg, #070d1c, #111a30, #1c2a48);
            border-color: rgba(255, 255, 255, 0.06);
            box-shadow:
                0 0 50px rgba(96, 165, 250, 0.07),
                0 8px 32px rgba(0, 0, 0, 0.25);
        }

        /* 悬停：边界更亮，光晕扩散 */
        .toggle:hover {
            transform: scale(1.07);
            border-color: rgba(255, 255, 255, 0.45);
            box-shadow:
                0 0 60px rgba(59, 130, 246, 0.25),
                0 12px 40px rgba(0, 0, 0, 0.08);
            transition: background 0.7s, transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94),
                box-shadow 0.4s ease, border-color 0.3s ease;
        }
        .toggle.night:hover {
            border-color: rgba(255, 255, 255, 0.16);
            box-shadow:
                0 0 70px rgba(96, 165, 250, 0.12),
                0 12px 40px rgba(0, 0, 0, 0.35);
        }

        /* 按下：边界收敛，体现按压感 */
        .toggle:active {
            transform: scale(1.03);
            border-color: rgba(255, 255, 255, 0.15);
            box-shadow:
                0 0 25px rgba(59, 130, 246, 0.10),
                0 4px 16px rgba(0, 0, 0, 0.04);
        }
        .toggle.night:active {
            border-color: rgba(255, 255, 255, 0.04);
            box-shadow:
                0 0 30px rgba(96, 165, 250, 0.05),
                0 4px 16px rgba(0, 0, 0, 0.18);
        }

        /* ===== 太阳 ===== */
        .sun {
            position: absolute;
            top: calc(14px * var(--ts));
            right: calc(22px * var(--ts));
            width: calc(28px * var(--ts));
            height: calc(28px * var(--ts));
            border-radius: 50%;
            background: radial-gradient(circle, #fff 0%, #ffd700 60%, #ffb300 100%);
            box-shadow: 0 0 8px rgba(255, 200, 0, 0.6), 0 0 18px rgba(255, 180, 0, 0.4), 0 0 30px rgba(255, 160, 0, 0.2);
            animation: sunGlow 2.5s ease-in-out infinite alternate;
            transition: opacity 0.5s, transform 0.5s;
        }
        .toggle.night .sun {
            opacity: 0;
            transform: scale(0.3);
        }
        @keyframes sunGlow {
            from { box-shadow: 0 0 8px rgba(255, 200, 0, 0.6), 0 0 18px rgba(255, 180, 0, 0.4), 0 0 30px rgba(255, 160, 0, 0.2); }
            to { box-shadow: 0 0 12px rgba(255, 210, 0, 0.8), 0 0 25px rgba(255, 190, 0, 0.5), 0 0 40px rgba(255, 170, 0, 0.3); }
        }

        /* ===== 云朵 ===== */
        .cloud {
            position: absolute;
            left: 0;
            background: #fff;
            border-radius: 999px;
            transition: opacity 0.55s ease;
            z-index: 1;
            pointer-events: none;
        }
        .cloud::before, .cloud::after {
            content: '';
            position: absolute;
            background: #fff;
            border-radius: 50%;
        }
        .cloud1 { width: calc(40px * var(--ts)); height: calc(18px * var(--ts)); top: 12%; }
        .cloud1::before { width: calc(22px * var(--ts)); height: calc(22px * var(--ts)); top: calc(-11px * var(--ts)); left: calc(4px * var(--ts)); }
        .cloud1::after  { width: calc(28px * var(--ts)); height: calc(28px * var(--ts)); top: calc(-14px * var(--ts)); right: calc(4px * var(--ts)); }
        .cloud2 { width: calc(32px * var(--ts)); height: calc(14px * var(--ts)); top: 52%; }
        .cloud2::before { width: calc(18px * var(--ts)); height: calc(18px * var(--ts)); top: calc(-9px * var(--ts)); left: calc(3px * var(--ts)); }
        .cloud2::after  { width: calc(22px * var(--ts)); height: calc(22px * var(--ts)); top: calc(-11px * var(--ts)); right: calc(3px * var(--ts)); }
        .cloud3 { width: calc(46px * var(--ts)); height: calc(20px * var(--ts)); top: 32%; }
        .cloud3::before { width: calc(26px * var(--ts)); height: calc(26px * var(--ts)); top: calc(-13px * var(--ts)); left: calc(5px * var(--ts)); }
        .cloud3::after  { width: calc(32px * var(--ts)); height: calc(32px * var(--ts)); top: calc(-16px * var(--ts)); right: calc(5px * var(--ts)); }
        .cloud4 { width: calc(28px * var(--ts)); height: calc(12px * var(--ts)); top: 64%; }
        .cloud4::before { width: calc(16px * var(--ts)); height: calc(16px * var(--ts)); top: calc(-8px * var(--ts)); left: calc(3px * var(--ts)); }
        .cloud4::after  { width: calc(20px * var(--ts)); height: calc(20px * var(--ts)); top: calc(-10px * var(--ts)); right: calc(3px * var(--ts)); }
        .cloud1 { animation: drift 20s linear infinite; animation-delay: 0s; }
        .cloud2 { animation: drift 28s linear infinite; animation-delay: -10s; }
        .cloud3 { animation: drift 24s linear infinite; animation-delay: -16s; }
        .cloud4 { animation: drift 16s linear infinite; animation-delay: -6s; }
        @keyframes drift {
            0%   { transform: translateX(calc(270px * var(--ts))); }
            100% { transform: translateX(calc(-90px * var(--ts))); }
        }
        .toggle.night .cloud { opacity: 0; }

        /* ===== 星星 ===== */
        .star {
            position: absolute;
            width: calc(3px * var(--ts));
            height: calc(3px * var(--ts));
            background: #fff;
            border-radius: 50%;
            opacity: 0;
            animation: twinkle 2s ease-in-out infinite;
        }
        .toggle.night .star { opacity: 1; }
        .star:nth-child(7)  { top: calc(18px * var(--ts)); left: calc(30px * var(--ts));  animation-delay: 0s;   }
        .star:nth-child(8)  { top: calc(32px * var(--ts)); left: calc(55px * var(--ts));  animation-delay: .3s;  }
        .star:nth-child(9)  { top: calc(14px * var(--ts)); left: calc(80px * var(--ts));  animation-delay: .6s;  }
        .star:nth-child(10) { top: calc(40px * var(--ts)); left: calc(100px * var(--ts)); animation-delay: .9s;  }
        .star:nth-child(11) { top: calc(22px * var(--ts)); left: calc(125px * var(--ts)); animation-delay: 1.2s; }
        .star:nth-child(12) { top: calc(50px * var(--ts)); left: calc(140px * var(--ts)); animation-delay: 1.5s; }
        .star:nth-child(13) { top: calc(16px * var(--ts)); left: calc(160px * var(--ts)); animation-delay: 1.8s; }
        .star:nth-child(14) { top: calc(38px * var(--ts)); left: calc(70px * var(--ts));  animation-delay: 2.1s; }
        @keyframes twinkle {
            0%, 100% { opacity: .2; transform: scale(1); }
            50%      { opacity: 1;  transform: scale(1.3); }
        }

        /* ===== 月亮（遮挡球：东→重合→西南直线→返回，月相循环） ===== */
        .moon {
            position: absolute;
            top: calc(12px * var(--ts));
            left: calc(22px * var(--ts));
            width: calc(30px * var(--ts));
            height: calc(30px * var(--ts));
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, #fff 0%, #fff6d9 50%, #f2e3a8 100%);
            box-shadow: 0 0 6px rgba(255, 250, 200, 0.5), inset -3px -3px 8px rgba(200, 180, 80, 0.2);
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.5s, transform 0.5s;
        }
        .toggle.night .moon {
            opacity: 1;
            transform: scale(1);
        }
        .moon::before {
            content: '';
            position: absolute;
            width: calc(30px * var(--ts));
            height: calc(30px * var(--ts));
            border-radius: 50%;
            background: #111a30;
            top: 0;
            left: 0;
            transform: translate(calc(34px * var(--ts)), 0);
            animation: moonPhase 24s ease-in-out infinite;
        }
        @keyframes moonPhase {
            0%   { transform: translate(calc(34px * var(--ts)), 0); }
            25%  { transform: translate(0, 0); }
            50%  { transform: translate(calc(-22px * var(--ts)), calc(22px * var(--ts))); }
            75%  { transform: translate(0, 0); }
            100% { transform: translate(calc(34px * var(--ts)), 0); }
        }

        /* ===== 滑块 ===== */
        .knob {
            position: absolute;
            z-index: 10;
            top: 50%;
            left: 0;
            width: calc(86px * var(--ts));
            height: calc(86px * var(--ts));
            border-radius: 50%;
            background: linear-gradient(135deg, #f0d080, #e8b84a);
            box-shadow: inset 0 -2px 6px rgba(0, 0, 0, 0.15), inset 0 2px 6px rgba(255, 255, 255, 0.3);
            transform: translateY(-50%);
            transition: transform 0.6s cubic-bezier(0.68, -0.1, 0.265, 1.2), background 0.6s;
        }
        .toggle.night .knob {
            transform: translate(calc(110px * var(--ts)), -50%);
            background: linear-gradient(135deg, #d8d8d8, #a8a8a8);
        }

        .switch {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            user-select: none;
            position: relative;
        }

        .switch input {
            appearance: none;
            width: 46px;
            height: 26px;
            border-radius: 999px;
            background: rgba(127, 127, 127, .35);
            position: relative;
            outline: none;
            cursor: pointer;
            transition: background .2s;
            flex-shrink: 0;
        }

        .switch input::after {
            content: "";
            position: absolute;
            width: 20px;
            height: 20px;
            top: 3px;
            left: 3px;
            border-radius: 999px;
            background: #fff;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
            transition: transform .2s;
        }

        .switch input:checked { background: var(--accent); }
        .switch input:checked::after { transform: translateX(20px); }

        .switch-label-text {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 14px;
            color: var(--fg);
            padding: 4px 8px;
            border-radius: 8px;
            transition: background .15s;
        }

        .switch-label-text:hover { background: rgba(127, 127, 127, .12); }

        .color-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2px solid rgba(127, 127, 127, .35);
            flex-shrink: 0;
            transition: transform .15s;
            box-sizing: border-box;
            cursor: pointer;
        }

        .switch-label-text:hover .color-dot { transform: scale(1.15); }

        .color-picker-popup {
            position: fixed;
            z-index: 1000;
            background: var(--bg);
            border: 1px solid rgba(127, 127, 127, .25);
            border-radius: 14px;
            padding: 12px 14px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, .35);
            display: none;
            min-width: 220px;
        }

        .color-picker-popup.show { display: block; }

        .color-picker-popup .preset-colors {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .color-picker-popup .preset-color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform .12s, border-color .12s, box-shadow .12s;
            outline: none;
            padding: 0;
            flex-shrink: 0;
        }

        .color-picker-popup .preset-color-btn:hover {
            transform: scale(1.2);
            box-shadow: 0 4px 14px rgba(0, 0, 0, .3);
            border-color: rgba(255, 255, 255, .6);
        }

        .color-picker-popup .preset-color-btn.active {
            border-color: #fff;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, .35);
            transform: scale(1.1);
        }

        .color-picker-popup .popup-label {
            font-size: 11px;
            color: var(--muted);
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: .3px;
        }

        .color-picker-popup .color-targets {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .color-picker-popup .color-target {
            flex: 1;
            padding: 7px 0;
            border: 1px solid rgba(127, 127, 127, .25);
            border-radius: 10px;
            background: rgba(127, 127, 127, .1);
            color: var(--fg);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all .15s;
            font-family: inherit;
            -webkit-user-select: none;
            user-select: none;
        }
        .color-picker-popup .color-target:hover { background: rgba(127, 127, 127, .18); }
        .color-picker-popup .color-target.active {
            background: var(--card);
            color: #fff;
            border-color: transparent;
        }

        /* ==================== 左侧竖向导航 ==================== */
        .side-nav {
            position: fixed;
            left: 6px;
            top: 96px;      /* 从顶部”资源下载”栏下方开始，不穿过该栏 */
            bottom: 20px;
            width: 140px;
            z-index: 500;
            display: flex;
            flex-direction: column;
            padding: 16px 10px;
            box-sizing: border-box;
            border-radius: 22px;
            background: rgba(127, 127, 127, .25); /* 兼容回退（不支持 color-mix 的浏览器） */
            background: color-mix(in srgb, var(--bg) 82%, transparent);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(127, 127, 127, .22);
            box-shadow: var(--shadow);
            transition: opacity .3s;
        }
        .side-nav .nav-head {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-indent: 3px;
            color: var(--muted);
            padding: 2px 0 12px;
            border-bottom: 1px solid rgba(127, 127, 127, .18);
            margin-bottom: 4px;
        }
        .side-nav .nav-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            gap: 8px;
        }
        .side-nav .nav-item {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            width: 64px;
            height: 64px;
            border-radius: 12px;
            color: var(--muted);
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            background: rgba(127,127,127,.1);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
            transition: transform .18s cubic-bezier(.2,.9,.3,1.2), box-shadow .18s, background .18s, color .18s;
            -webkit-user-select: none;
            user-select: none;
        }
        .side-nav .nav-item .nav-ico {
            font-size: 22px;
            line-height: 1;
            flex-shrink: 0;
        }
        .side-nav .nav-item .nav-txt {
            font-size: 11px;
            line-height: 1.1;
        }
        .side-nav .nav-item .nav-tip {
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) scale(.6);
            background: rgba(20,20,24,.95);
            color: #fff;
            font-size: 11.5px;
            padding: 4px 10px;
            border-radius: 6px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .15s, transform .15s;
            white-space: nowrap;
            z-index: 10;
        }
        .side-nav .nav-item:hover .nav-tip {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
        .side-nav .nav-item:hover {
            color: var(--fg);
            background: rgba(127,127,127,.18);
            transform: translateY(-8px) scale(1.12);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.15), 0 10px 20px rgba(0,0,0,.2);
        }
        .side-nav .nav-item.active {
            color: #fff;
            background: linear-gradient(135deg, #34d474, #16a34a);
            box-shadow: inset 0 0 0 1px rgba(255,255,255,.25), 0 8px 20px rgba(0,0,0,.25);
        }
        body.locked .side-nav { opacity: 0; pointer-events: none; }
        @media (max-width: 760px) {
            .side-nav { display: none; }
            /* 导航隐藏后，恢复左侧空间，避免小屏浪费 */
            #app { padding: 0 18px 80px; }
        }

        /* ==================== 主内容区 ==================== */
        main {
            overflow-y: auto;
            overflow-x: hidden;
            padding: var(--grid-padding);
            box-sizing: border-box;
            scrollbar-width: thin;
        }

        main::-webkit-scrollbar { width: 6px; }
        main::-webkit-scrollbar-thumb { background: rgba(127,127,127,.3); border-radius: 3px; }

        .detail-container {
            width: min(1100px, 100%);
            /* 靠左对齐，始终紧贴左侧导航（右侧自适应，避免宽屏时容器居中导致左侧空隙变大） */
            margin-left: 0;
            margin-right: auto;
            animation: fadeIn .25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============ 本期分享详细介绍 ============ */
        .intro-share {
            background: rgba(127, 127, 127, .08);
            border: 1px solid rgba(127, 127, 127, .16);
            border-radius: 16px;
            padding: 22px 24px 18px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.9;
            color: var(--fg);
            animation: fadeIn .5s ease both;
        }
        .intro-share .share-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        function rgbToHex(r,g,b){ const cl=v=>Math.max(0,Math.min(255,Math.round(v))); return '#'+[cl(r),cl(g),cl(b)].map(v=>cl(v).toString(16).padStart(2,'0')).join(''); }
        function adjustBrightness(hex,f){const{r,g,b}=hexToRgb(hex);return rgbToHex(r+(255-r)*(f-1),g+(255-g)*(f-1),b+(255-b)*(f-1));}

                ripple.style.left = (e.clientX - rect.left) + 'px';

                card.appendChild(ripple);

                // 兜底清理：动画结束后无论事件是否触发都移除节点（如系统开启"减弱动态效果"）

                    if (e.key === 'Backspace' && !inp.value && idx > 0) {
                        e.preventDefault();
                        inputs[idx - 1].focus();

                    }
                    errEl.classList.remove('show');
                    if (pasted.length === 4) { verify(); }
                    else { inputs[Math.min(pasted.length, inputs.length - 1)].focus(); }

            // 禁止 ESC 关闭弹窗
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape' && !overlay.classList.contains('hide')) {
                    e.preventDefault();
                    clearInputs();
                }
            });

            // 禁止点击遮罩关闭
            overlay.addEventListener('click', e => {
                if (e.target === overlay) {
                    inputs[0].focus();
                }
            });

            // 自动聚焦第一个输入框
            window.addEventListener('load', () => {
                setTimeout(() => inputs[0].focus(), 300);
            });
        })();

        /* ==================== 初始化 ==================== */
        (function init(){
            const savedColor=localStorage.getItem(LS_CARD_COLOR);
            currentCardColor=(savedColor&&PRESET_COLORS.includes(savedColor))?savedColor:(savedColor||'#22c55e');
            const savedAlt=localStorage.getItem(LS_ALT_COLOR);
            currentAltColor=(savedAlt&&PRESET_COLORS.includes(savedAlt))?savedAlt:(savedAlt||'#ef4444');
            const savedScale=parseFloat(localStorage.getItem(LS_CARD_SCALE));
            cardScale=(savedScale>=SCALE_MIN&&savedScale<=SCALE_MAX)?savedScale:SCALE_DEFAULT;
            applyScale(cardScale);
            applyTheme(localStorage.getItem(LS_THEME)||'light');
            if(colorDot)colorDot.style.backgroundColor=currentColor();
            buildPresetColors();
            renderPage();
            updateSideNav();
        })();
    </script>
</body>
</html>
